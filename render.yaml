# Render Blueprint for the SURYA backend (FastAPI) and its Postgres database.
# The web console is deployed separately on Vercel (see vercel.json).
databases:
  - name: surya-db
    plan: free
    region: singapore
    databaseName: surya
    user: surya

services:
  - type: web
    name: surya-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # Migrate first; one worker so only one decision scheduler runs.
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: surya-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://surya-sim.vercel.app
      # Loads the Prestige University demo microgrid and demo accounts on first start.
      - key: SEED_DEMO_DATA
        value: "true"
      # Google OAuth web client ID for "Continue with Google"; set in the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
